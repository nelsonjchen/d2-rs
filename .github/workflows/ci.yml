name: Rust foundation
# Branch pushes and pull requests only: a release tag points at a commit whose
# branch push already ran these jobs, and release.yml builds the tag.
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  parity-harness:
    # The fixture generator's defaults target arm64, the reference platform.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv run --no-project --with pillow python -B -m unittest discover -s scripts -p "test_render_*.py" -v
      - run: uv run --no-project python -B -m unittest discover -s scripts -p "test_e2e_png_scoreboard.py" -v
      - run: uv run --no-project python -B -m unittest discover -s scripts -p "test_regen_fixtures.py" -v
      - run: uv run --no-project python -B -m unittest discover -s scripts -p "test_perf_bench.py" -v
      - run: uv run --no-project python -B -m unittest discover -s scripts -p "test_imageasset_policy_scoreboard.py" -v
      - run: uv run --no-project python -B -m unittest discover -s scripts -p "test_oracle_provenance.py" -v
      - run: uv run --no-project python -B -m unittest discover -s scripts -p "test_language_scoreboard.py" -v
      - run: uv run --no-project python -B -m unittest discover -s scripts -p "test_scenebuild_asset_scoreboard.py" -v
      - run: uv run --no-project python -B -m unittest discover -s scripts -p "test_scenebuild_fallback_scoreboard.py" -v
      - name: Test retained isometric scoreboards
        run: |
          for suite in raster content page_glyph precision lanes geometry frame residual; do
            uv run --no-project python -B -m unittest discover -s scripts -p "test_isometric_${suite}_scoreboard.py" -v
          done
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all --check
      # The oracle tier (--all-features) reads regenerated Go output from
      # oracle-cache/ and runs on the arm64 and x86-64 qualification hosts
      # (docs/FIXTURES.md). Clippy still compiles it here.
      - run: cargo test --workspace --locked
        if: runner.os != 'Windows'
      # Windows passes the default tier and matches Go on every e2e board
      # natively (MSVC) and under Wine, but those runs happen outside CI; here
      # its tests only compile.
      - run: cargo test --workspace --locked --no-run
        if: runner.os == 'Windows'
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
  checked-cells:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - run: cargo test --locked --release -p d2-rs-tala --features checked-cells
  wasm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    defaults:
      run:
        working-directory: crates/d2-rs-wasm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      # Lint the wasm32-only code paths, which the host clippy jobs never see.
      - run: cargo clippy -p d2-rs-wasm --target wasm32-unknown-unknown --all-targets --locked -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@9.0.6 --activate
      - name: Install lockfile-matched WASM bindings CLI
        run: |
          cargo install --locked --version 0.2.128 --root "$GITHUB_WORKSPACE/.reference/wasm-bindgen-cli" wasm-bindgen-cli
          echo "$GITHUB_WORKSPACE/.reference/wasm-bindgen-cli/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # test-node.mjs and the browser contracts read oracle fixtures and run
      # on the qualification hosts; runtime recovery is self-contained.
      - run: node ./scripts/test-runtime-recovery.mjs
      - run: pnpm test:types
