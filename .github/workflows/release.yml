name: Release binaries

# Builds prebuilt d2-rs archives for the platforms Go D2 releases
# (linux, macos and windows on amd64 and arm64), packaged like D2's
# d2-<VERSION>-<OS>-<ARCH>.tar.gz archives, and attaches them with a
# SHA256SUMS file to the GitHub release for the tag. The tests already ran on
# the tagged commit's branch push, so this workflow only builds and
# smoke-tests the binaries. Windows also gets an MSI installer for amd64
# and arm64 (tools/release/windows), installed and uninstalled as a test.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, such as v0.1.4
        required: true
      publish:
        description: Upload the archives and installers to the release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc floor at 2.35.
          - { os: linux, arch: amd64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: linux, arch: arm64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos, arch: arm64, runner: macos-latest, target: aarch64-apple-darwin }
          # GitHub has no Intel macOS runner left; cross-compile on arm64.
          - { os: macos, arch: amd64, runner: macos-latest, target: x86_64-apple-darwin }
          - { os: windows, arch: amd64, runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows, arch: arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the tag
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "release tag must be a v-prefixed semantic version, got $TAG" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: ${{ matrix.target }}
      - name: Build
        env:
          # Link the MSVC runtime statically, so the .exe needs no
          # Visual C++ redistributable, as Go's d2.exe needs none.
          RUSTFLAGS: ${{ contains(matrix.target, 'windows-msvc') && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked -p d2-rs --target ${{ matrix.target }}
      - name: Smoke test
        run: |
          exe=target/${{ matrix.target }}/release/d2-rs
          if [[ "${{ matrix.os }}" == windows ]]; then exe=$exe.exe; fi
          runner=()
          if [[ "${{ matrix.target }}" == x86_64-apple-darwin ]]; then
            if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
              echo "Rosetta is unavailable; checking the Mach-O header only"
              file "$exe" | grep -q x86_64
              exit 0
            fi
            runner=(arch -x86_64)
          fi
          "${runner[@]}" "$exe" --version
          printf 'a -> b: hello\nb -> c\n' >smoke.d2
          "${runner[@]}" "$exe" smoke.d2 smoke.svg
          grep -q '<svg' smoke.svg
          "${runner[@]}" "$exe" --layout=tala smoke.d2 smoke-tala.svg
          grep -q '<svg' smoke-tala.svg
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/d2-rs${{ matrix.os == 'windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 7

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      # Package with this workflow's tools/release, which older tags lack.
      - uses: actions/checkout@v4
        with:
          path: release-tools
          persist-credentials: false
          sparse-checkout: tools/release
      - uses: actions/download-artifact@v4
        with:
          path: bins
          pattern: bin-*
      - name: Package archives
        run: |
          set -euo pipefail
          cp -R release-tools/tools/release/. tools/release/
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          for dir in bins/bin-*; do
            platform=${dir#bins/bin-}
            os=${platform%-*}
            arch=${platform#*-}
            exe=$dir/d2-rs
            if [[ $os == windows ]]; then exe=$exe.exe; fi
            ./tools/release/package.sh "$TAG" "$os" "$arch" "$exe" dist
          done
          count=$(ls dist/*.tar.gz | wc -l)
          if [[ $count -ne 6 ]]; then
            echo "expected six archives, got $count" >&2
            exit 1
          fi
          for archive in dist/*.tar.gz; do
            echo "== $archive ($(stat -c %s "$archive") bytes)"
            tar -tvzf "$archive"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-archives
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Windows installers, like Go D2's d2-<VERSION>-windows-amd64.msi, built
  # from the packaged archive on each architecture's own runner so the
  # install test runs natively.
  msi:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    env:
      # The repository owner accepted the WiX 7 OSMF EULA for d2-rs
      # (tools/release/windows/build-msi.ps1).
      WIX7_EULA_ACCEPTED: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      # This workflow's tools/release, which older tags lack.
      - uses: actions/checkout@v4
        with:
          path: release-tools
          persist-credentials: false
          sparse-checkout: tools/release
      - uses: actions/download-artifact@v4
        with:
          name: dist-archives
          path: dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.0
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add -acceptEula wix7 --global WixToolset.UI.wixext/7.0.0
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build and test the installer
        shell: pwsh
        run: |
          ./release-tools/tools/release/windows/build-msi.ps1 -Version $env:TAG -Arch ${{ matrix.arch }} `
            -ArchivePath "dist/d2-rs-$env:TAG-windows-${{ matrix.arch }}.tar.gz" -OutputDirectory msi -InstallTest
      - uses: actions/upload-artifact@v4
        with:
          name: dist-msi-${{ matrix.arch }}
          path: msi/*.msi
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [package, msi]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Checksum
        run: |
          set -euo pipefail
          count=$(ls dist/*.tar.gz dist/*.msi | wc -l)
          if [[ $count -ne 8 ]]; then
            echo "expected six archives and two installers, got $count" >&2
            exit 1
          fi
          (cd dist && sha256sum -- *.tar.gz *.msi >SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "d2-rs ${TAG#v}" \
              --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
          fi
          # Replaces earlier copies of these assets; never touches the notes.
          gh release upload "$TAG" dist/*.tar.gz dist/*.msi dist/SHA256SUMS --clobber
