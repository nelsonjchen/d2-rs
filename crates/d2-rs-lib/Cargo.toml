[package]
name = "d2-rs-lib"
description = "D2's serialized graph JSON boundary between the compiler and the layout engines."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
default = []
diagnostic-traces = ["d2-rs-tala/diagnostic-traces"]
# Oracle tier: tests that read Go-oracle artifacts regenerated into
# oracle-cache/fixtures by scripts/regen-fixtures.py (docs/FIXTURES.md).
oracle-fixtures = []

[dependencies]
base64.workspace = true
d2-rs-goflate.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
d2-rs-tala = { workspace = true, default-features = false }
d2-rs-core.workspace = true
d2-rs-language.workspace = true

[dev-dependencies]
d2-rs-testdata.workspace = true

[lints]
workspace = true
