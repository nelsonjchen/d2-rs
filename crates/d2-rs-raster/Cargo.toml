[package]
name = "d2-rs-raster"
description = "Rust port of D2's d2raster package (d2scene document to pixels)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"

[features]
default = []
diagnostic-traces = []
# Oracle tier: tests that read Go-oracle artifacts regenerated into
# oracle-cache/fixtures by scripts/regen-fixtures.py (docs/FIXTURES.md).
oracle-fixtures = []

[dependencies]
d2-rs-goflate.workspace = true
d2-rs-core.workspace = true
d2-rs-render.workspace = true
d2-rs-scene.workspace = true
d2-rs-fontface.workspace = true
serde.workspace = true
serde_json.workspace = true
num-bigint.workspace = true
num-rational.workspace = true
num-traits = "0.2.19"
png.workspace = true
gif.workspace = true
zune-jpeg.workspace = true
image-webp.workspace = true

[dev-dependencies]
d2-rs-testdata.workspace = true
base64.workspace = true

[lints]
workspace = true
