[package]
name = "d2-rs-export"
description = "Rust port of D2's PNG, PDF, PPTX, GIF and ASCII exporters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
default = []
diagnostic-traces = ["d2-rs-render/diagnostic-traces"]
# Oracle tier: tests that read Go-oracle artifacts regenerated into
# oracle-cache/fixtures by scripts/regen-fixtures.py (docs/FIXTURES.md).
oracle-fixtures = []

[dependencies]
d2-rs-core.workspace = true
d2-rs-goflate.workspace = true
d2-rs-math.workspace = true
d2-rs-language.workspace = true
d2-rs-render.workspace = true
d2-rs-scene.workspace = true
d2-rs-raster.workspace = true
d2-rs-scenebuild.workspace = true
d2-rs-target.workspace = true
d2-rs-text.workspace = true
d2-rs-tala.workspace = true
serde_json.workspace = true
ttf-parser.workspace = true
gif.workspace = true
png.workspace = true
thiserror.workspace = true
flate2.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
base64.workspace = true
roxmltree.workspace = true
sha2.workspace = true
zip.workspace = true
d2-rs-testdata.workspace = true
serde.workspace = true

[lints]
workspace = true
