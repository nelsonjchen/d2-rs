[package]
name = "d2-rs-fontface"
description = "Rust port of D2's internal fontface package: font parsing, shaping, glyph outlines and COLRv1."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"

[features]
default = []
diagnostic-traces = ["d2-rs-render/diagnostic-traces"]
# Oracle tier: tests that read Go-oracle artifacts regenerated into
# oracle-cache/fixtures by scripts/regen-fixtures.py (docs/FIXTURES.md).
oracle-fixtures = []

[dependencies]
d2-rs-render.workspace = true
d2-rs-scene.workspace = true
serde.workspace = true
serde_json.workspace = true
rustybuzz.workspace = true
ttf-parser.workspace = true
sha2.workspace = true

[build-dependencies]
brotli-decompressor.workspace = true
sha2.workspace = true

[dev-dependencies]
d2-rs-text.workspace = true
d2-rs-testdata.workspace = true
brotli-decompressor.workspace = true
flate2.workspace = true

[lints]
workspace = true
