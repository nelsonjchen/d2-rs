# d2-rs-language oracle fixtures over the public d2compiler and the master-only
# internal d2compiler/d2ir tests, captured at the manifest pin.
#
# - lang-edge-key-validation: a go-test-hook compiling the generated
#   edge/arrowhead key matrix (scripts/edge_key_validation_cases.py) with the
#   public d2compiler.Compile.
# - lang-master-*: scripts/check-language-master-hooks.py replays original
#   upstream tests (assertions active) with their call sites routed through the
#   env-gated observers in tools/language-master-scoreboard, via go test
#   -overlay; the upstream tree is never modified.
#
# Regenerate:  uv run --no-project python scripts/regen-fixtures.py --only 'lang-edge-key-*' --only 'lang-master-*'
# Test:        cargo test -p d2-rs-language --features oracle-fixtures

[defaults]
timeout = 1800

[defaults.key_deps]
go_toolchain = true
# The package closure of d2compiler inside the D2 module (`go list -deps`),
# which contains d2ir's; the replayed tests live in d2compiler and d2ir.
upstream_paths = [
  "go.mod",
  "go.sum",
  "d2ast",
  "d2compiler",
  "d2format",
  "d2graph",
  "d2ir",
  "d2parser",
  "d2target",
  "d2themes",
  "d2renderers/d2fonts",
  "d2renderers/d2latex",
  "d2renderers/d2scene",
  "d2renderers/internal",
  "lib/color",
  "lib/font",
  "lib/geo",
  "lib/label",
  "lib/shape",
  "lib/svg",
  "lib/syncmap",
  "lib/textmeasure",
]

[[recipe]]
name = "lang-edge-key-validation"
kind = "go-test-hook"
description = "d2compiler.Compile diagnostics for the edge/arrowhead map key and value matrix"
outputs = ["crates/d2-rs-language/tests/fixtures/edge-key-validation-source-master.json"]
inputs = [{ path = "edge-key-cases.json", generate = ["{python}", "scripts/edge_key_validation_cases.py"] }]
package = "d2compiler"
hooks = ["tools/fixtures/hooks/lang-edge-key-validation/d2rs_edge_key_validation_test.go"]
test = "TestD2RSEdgeKeyValidation"

[recipe.key_deps]
files = ["scripts/edge_key_validation_cases.py"]

[[recipe]]
name = "lang-master-class-index"
kind = "command"
upstream = true
description = "TestClassLookup*: every class lookup, typed error and retained index count"
outputs = ["crates/d2-rs-language/tests/fixtures/master-class-index.json"]
argv = ["{python}", "scripts/check-language-master-hooks.py", "class-index"]
key_deps.files = ["scripts/fixture_recipe.py", "scripts/language_oracle.py", "scripts/check-language-master-hooks.py",
                  "tools/language-master-scoreboard/class_index_hook_test.go"]

