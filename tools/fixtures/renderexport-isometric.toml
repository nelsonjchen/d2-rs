# d2-rs-isometric oracle fixtures (renderexport area). See docs/FIXTURES.md.
#
# The *-api recipes run a scoreboard's original-test capture: upstream
# d2isometricimg / d2svg test bodies with call replacements plus the
# scoreboard hook, against the runner's upstream tree through a go overlay
# (scripts/upstream_overlay.py; the tree itself is never written). The
# scoreboard's own verify() gates the capture; cargo test does the comparison.
# shape and solid keep only the witness operations of the original fixtures
# (tools/fixtures/seeds/isometric-{shape,solid}-select.json); the full
# solid capture is about 170 MB, over the 128 MiB per-file budget.
#
# Regenerate:  uv run --no-project python scripts/regen-fixtures.py --only 'isometric-*' --jobs 4
# Test:        cargo test -p d2-rs-isometric --features oracle-fixtures

[defaults]
kind = "command"
timeout = 1800

[defaults.key_deps]
files = [
  "scripts/fixture_recipe.py",
  "scripts/references.py",
]

[[recipe]]
name = "isometric-artwork-api"
description = "Original d2isometricimg artwork tests: requests and Go results"
upstream = true
outputs = ["crates/d2-rs-isometric/tests/fixtures/artwork-api.json"]
argv = ["{python}", "scripts/isometric_oracle_fixtures.py", "api", "--script", "scripts/isometric-artwork-scoreboard.py", "--output", "crates/d2-rs-isometric/tests/fixtures/artwork-api.json", "--format", "compact"]
key_deps.files = ["scripts/upstream_overlay.py", "scripts/isometric-geometry-scoreboard.py", "scripts/isometric-scene-scoreboard.py", "scripts/cli-scoreboard.py", "scripts/asset-policy-scoreboard.py", "scripts/imageasset-scoreboard.py", "scripts/language-scoreboard.py", "scripts/isometric-artwork-scoreboard.py", "tools/isometric-artwork-scoreboard", "tools/isometric-solid-scoreboard"]
key_deps.upstream_paths = ["d2renderers", "d2target", "d2themes", "lib", "go.mod", "go.sum"]

