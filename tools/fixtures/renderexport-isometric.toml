# Second pass: the remaining d2-rs-isometric API captures. `api` recipes keep
# whole original tests (--tests) from a scoreboard capture; `probe-api` recipes
# record the public Render/RenderPage calls of one tools/isometric-probe suite.
# Go t.TempDir() roots are written as @D2RS_TMP@/<Test>/<NNN> and tests that
# iterate a Go map literal get canonically sorted operations, so reruns are
# byte-identical (scripts/isometric_oracle_fixtures.py).

