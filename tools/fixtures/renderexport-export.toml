# Go-oracle fixtures for crates/d2-rs-export (also read by d2-rs-fontface and
# d2-rs-math): COLRv1 plans, lib/imageasset codecs, raster asset validation
# and Go 1.27 PNG encoding. See docs/FIXTURES.md; recipes retired with the
# legacy SVG renderer are listed in docs/fixture-retirements/renderexport.md.
#
# The hooks under tools/fixtures/hooks/renderexport-*/ were harvested from the
# untracked v0.9.0-era probes (../d2-v0.9.0-trace/**/*_probe_test.go,
# tools/probes/*.go, .reference/*/probe*_test.go and *-bridge.go) and now run
# against the manifest pin. Request grids are generated by
# scripts/renderexport_inputs.py; bytes the Python standard library cannot
# produce (brotli streams, encoded JPEGs) come from the small seeds under
# tools/fixtures/inputs/renderexport/.
#
# Regenerate:  uv run --no-project python scripts/regen-fixtures.py --only 'renderexport-*' --jobs 4
# Test:        cargo test -p d2-rs-export -p d2-rs-fontface -p d2-rs-math --features oracle-fixtures

[defaults]
kind = "go-test-hook"
timeout = 1800
# key_deps.upstream_paths is per recipe: each lists its hooked package's
# import closure (renderers/scene/fonts/raster plus lib/target dependencies).

[[recipe]]
name = "renderexport-raster-validation"
description = "validateRasterAsset/prepareRasterAsset metadata, budgets, errors, cancellation and prepared colors"
outputs = ["crates/d2-rs-export/tests/fixtures/raster-validation-v090.json"]
inputs = [{ path = "raster-validation-requests.json", generate = ["{python}", "scripts/renderexport_inputs.py", "raster-validation"] }]
package = "d2renderers/d2raster"
hooks = ["tools/fixtures/hooks/renderexport-raster-validation/d2rs_raster_validation_test.go"]
test = "TestD2RSRasterValidation"
key_deps.files = ["tools/fixtures/inputs/renderexport/raster-validation-seed.json"]
key_deps.upstream_paths = ["d2renderers", "d2target", "d2themes", "lib", "internal", "go.mod", "go.sum"]

[[recipe]]
name = "renderexport-colrv1-plans"
description = "COLRv1 paint plan or error for every glyph of the bundled Noto Color Emoji"
outputs = ["crates/d2-rs-export/tests/fixtures/colrv1-plans-source-v090.json"]
package = "d2renderers/d2fonts"
hooks = ["tools/fixtures/hooks/renderexport-colrv1-plans/d2rs_colrv1_plan_test.go"]
test = "TestD2RSCOLRv1Plans"
key_deps.upstream_paths = ["d2renderers", "d2target", "d2themes", "lib", "internal", "go.mod", "go.sum"]

[[recipe]]
name = "renderexport-svg-asset-codec"
description = "lib/imageasset probeResource SVG codec (gzip/zlib/deflate/brotli/raw) outcomes"
outputs = ["crates/d2-rs-export/tests/fixtures/svg-asset-codec-outcomes-source-v090.json"]
inputs = [{ path = "svg-asset-codec-requests.json", generate = ["{python}", "scripts/renderexport_inputs.py", "codec"] }]
package = "lib/imageasset"
hooks = ["tools/fixtures/hooks/renderexport-svg-asset-codec/d2rs_svg_asset_codec_test.go"]
test = "TestD2RSSVGAssetCodec"
key_deps.files = ["tools/fixtures/inputs/renderexport/svg-asset-codec-seed.json"]
key_deps.upstream_paths = ["lib", "internal", "go.mod", "go.sum"]

[[recipe]]
name = "renderexport-png-encoding"
kind = "go-program"
description = "Go 1.27 image/png BestSpeed bytes and fpdf-style RGB/alpha plane zlib streams (toolchain-only)"
outputs = ["crates/d2-rs-export/tests/fixtures/png-encoding-go127.json"]
program = "tools/png-encoding-oracle"
module = "tools/png-encoding-oracle"
args = ["{output}"]
