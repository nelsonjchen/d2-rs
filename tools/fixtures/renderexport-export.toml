# Host-architecture note (png-image-aspect, gradient-samples): the historical
# v0.9.0 captures came from darwin-arm64, where the Go compiler fuses x*y+z
# into FMA; the Rust ports follow that with explicit mul_add. amd64 Go never
# fuses (GOAMD64=v3 does not change it), so on amd64 hosts these two artifacts
# differ in last-bit placements and duplicate-stop boundary samples and their
# Rust oracle tests fail. Regenerate them on an arm64 host to match.
[[recipe]]
name = "renderexport-png-image-aspect"
description = "PNG image aspect placement and sampled 24x24 frames (23 aspects x 3 boxes x 4 matrices x 2 images)"
outputs = ["crates/d2-rs-export/tests/fixtures/png-image-aspect-source-v090.json"]
package = "d2renderers/d2raster"
hooks = ["tools/fixtures/hooks/renderexport-png-image-aspect/d2rs_png_image_aspect_test.go"]
test = "TestD2RSPNGImageAspect"
key_deps.upstream_paths = ["d2renderers", "d2target", "d2themes", "lib", "internal", "go.mod", "go.sum"]

[[recipe]]
name = "renderexport-gradient-samples"
description = "Prepared gradient inverse matrices and colorAt samples for 288 linear/radial requests"
outputs = ["crates/d2-rs-export/tests/fixtures/gradient-samples-source-v090.json"]
inputs = [{ path = "gradient-requests.json", generate = ["{python}", "scripts/renderexport_inputs.py", "gradient"] }]
package = "d2renderers/d2raster"
hooks = ["tools/fixtures/hooks/renderexport-gradient-samples/d2rs_gradient_samples_test.go"]
test = "TestD2RSGradientSamples"
key_deps.upstream_paths = ["d2renderers", "d2target", "d2themes", "lib", "internal", "go.mod", "go.sum"]

