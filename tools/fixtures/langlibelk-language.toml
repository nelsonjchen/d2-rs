# d2-rs-language oracle fixtures over the private and public d2parser, d2format
# and d2ir surface, captured at the manifest pin.
#
# Generators are scripts/check-*.py (via scripts/language_oracle.py). Each
# builds its harness in the recipe workdir against the runner's patched
# upstream tree with upstream's own go.mod/go.sum:
# - tools/parser-oracle: main.go plus upstream d2parser/parse.go with its
#   package clause renamed to main; private d2ir functions via go:linkname.
# - tools/field-oracle: main.go plus bridge.go overlaid into d2ir as
#   d2ir/oracle_fields.go; the trace build also overlays d2ir/compile.go with
#   compileKey enter/exit events. The upstream tree is never modified.
# Requests are generated by the scripts (never committed); the only committed
# inputs are the D2 sources under tests/d2; the upstream e2e inputs listed in
# scripts/upstream_inputs.py are read from the patched upstream tree.
#
# Regenerate:  uv run --no-project python scripts/regen-fixtures.py --only 'lang-*'
# Test:        cargo test -p d2-rs-language --features oracle-fixtures

[defaults]
kind = "command"
upstream = true
timeout = 1800

[defaults.key_deps]
files = [
  "scripts/fixture_recipe.py",
  "scripts/language_oracle.py",
]
go_toolchain = true
# The package closure of d2parser, d2format and d2ir inside the D2 module
# (`go list -deps`): d2ir links d2target and the theme/font/text-measure
# packages. Mined test files live in these directories too.
upstream_paths = [
  "go.mod",
  "go.sum",
  "d2ast",
  "d2format",
  "d2parser",
  "d2ir",
  "d2target",
  "d2themes",
  "d2renderers/d2fonts",
  "d2renderers/d2scene",
  "d2renderers/internal",
  "lib/color",
  "lib/font",
  "lib/geo",
  "lib/label",
  "lib/shape",
  "lib/svg",
  "lib/syncmap",
  "lib/textmeasure",
]

