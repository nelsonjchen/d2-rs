# d2-rs-language compiler contract fixtures, captured at the manifest pin by
# scripts/check-language-compile-contracts.py: constructed D2 inputs from
# tools/fixtures/seeds/lang-compile-contracts/ (or the hand-written request
# files the legend and config-data tests read) replayed through
# tools/public-compiler-oracle (compile/inspect/measure) and, for style-colors,
# the lib/color hook in tools/language-master-scoreboard. Only Go output is
# regenerated; logical paths keep their historical names.
#
# Regenerate:  uv run --no-project python scripts/regen-fixtures.py --only 'lang-contract-*'
# Test:        cargo test -p d2-rs-language --features oracle-fixtures

[defaults]
kind = "command"
upstream = true
timeout = 1800

[defaults.key_deps]
files = [
  "scripts/fixture_recipe.py",
  "scripts/language_oracle.py",
  "scripts/check-public-compiler.py",
  "scripts/public_compiler_cases.py",
  "scripts/check-language-compile-contracts.py",
  "tools/public-compiler-oracle",
  "tools/language-master-scoreboard/style_color_hook_test.go",
  "tools/fixtures/seeds/lang-compile-contracts",
  "crates/d2-rs-language/tests/fixtures/legend-validation-inputs-v090.json",
  "crates/d2-rs-language/tests/fixtures/config-data-inputs-v090.json",
]
go_toolchain = true

[[recipe]]
name = "lang-contract-style-color-diagnostics"
description = "Applied color values and diagnostic order"
outputs = ["crates/d2-rs-language/tests/fixtures/style-color-diagnostics-go-master.json"]
argv = ["{python}", "scripts/check-language-compile-contracts.py", "style-color-diagnostics"]

[[recipe]]
name = "lang-contract-style-color-scope"
description = "Color validation scope: classes, icons, legends and boards"
