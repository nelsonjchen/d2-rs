# D2 d2renderers/d2latex Render/Measure rows (mathjax-go behind D2's input
# limits) for the d2-rs-math TeX contract tests. See docs/FIXTURES.md.
#
# Every recipe runs the same hook, tools/fixtures/hooks/mathtext-latex/
# d2rs_latex_test.go, over a committed expression list in
# tools/fixtures/inputs/mathtext-latex/<name>.json (extracted from the former
# v0.9.0 captures). The env selects the row layout the reader expects:
# D2RS_LATEX_ERRORS (always | omitempty), D2RS_LATEX_JSON (indent | compact,
# optional -escape) and D2RS_LATEX_HEADER=1 for the {upstream_commit,
# mathjax_go, licenses, cases} wrapper.
#
# Regenerate:  uv run --no-project python scripts/regen-fixtures.py --only 'mathtext-latex-*'
# Test:        cargo test -p d2-rs-math --features oracle-fixtures

[defaults]
kind = "go-test-hook"
package = "d2renderers/d2latex"
hooks = ["tools/fixtures/hooks/mathtext-latex/d2rs_latex_test.go"]
test = "TestD2RSCaptureLatex"
timeout = 1800

[defaults.key_deps]
upstream_paths = ["d2renderers/d2latex", "go.mod", "go.sum"]

[[recipe]]
name = "mathtext-latex-aboxed"
outputs = ["crates/d2-rs-math/tests/fixtures/aboxed-source-v090.json"]
inputs = ["tools/fixtures/inputs/mathtext-latex/aboxed.json"]
env = { D2RS_LATEX_ERRORS = "always", D2RS_LATEX_JSON = "indent" }

