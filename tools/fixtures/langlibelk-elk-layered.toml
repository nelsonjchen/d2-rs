# elk-go (github.com/d2lang/elk-go) Layered, Box and Rectpacking fixtures for
# crates/d2-rs-elk (model_order_contract.rs, box_layout.rs, rectpacking/mod.rs).
#
# scripts/check-elk-layered.py builds tools/elk-oracle (elk.LayoutJSON) for
# arm64 in a minimal module requiring only elk-go at the version pinned in
# reference-manifest.json `dependencies`, runs every case of the fixture's
# generator in scripts/elk_cases and records the raw output. Some matrices
# start from elk-go's own testdata/curated graphs, read from the same pinned
# module. The D2 pin does not matter, so these recipes do not use the
# upstream checkout.
#
# Regenerate:  uv run --no-project python scripts/regen-fixtures.py --only 'elk-layered-*'
# Test:        cargo test -p d2-rs-elk --features oracle-fixtures

[defaults]
kind = "command"
timeout = 1800

[defaults.key_deps]
files = [
  "scripts/fixture_recipe.py",
  "scripts/elk_oracle.py",
  "tools/elk-oracle/main.go",
  "tools/oracle/go.mod",
  "tools/oracle/go.sum",
]
go_modules = ["github.com/d2lang/elk-go"]
go_toolchain = true

