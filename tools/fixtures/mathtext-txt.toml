# Text-side oracle fixtures of the mathtext area (docs/FIXTURES.md):
# Chroma, uniseg, go-text/typesetting Unicode and mathjax-go mhchem
# (third-party; keyed on module version + Go toolchain via each oracle's own
# go.mod/go.sum, not the D2 pin), plus D2 lib/textmeasure and d2oracle
# captures (keyed on the upstream paths they read).
#
# Regenerate:  uv run --no-project python scripts/regen-fixtures.py --only 'mathtext-txt-*'
# Test:        cargo test -p d2-rs-text -p d2-rs-editor -p d2-rs-math -p rustybuzz \
#                --features d2-rs-text/oracle-fixtures,d2-rs-editor/oracle-fixtures,d2-rs-math/oracle-fixtures,rustybuzz/oracle-fixtures

[defaults]
timeout = 1800

[defaults.key_deps]
files = ["scripts/fixture_recipe.py", "scripts/mathtext_gen.py"]

# ---- Chroma (github.com/alecthomas/chroma/v2) ------------------------------

[[recipe]]
name = "mathtext-txt-chroma-javascript-json"
kind = "go-program"
description = "Chroma JavaScript/JSON token streams and github/catppuccin-mocha token styles"
outputs = ["crates/d2-rs-text/tests/fixtures/javascript-json-tokens-v227.json"]
inputs = [{ path = "javascript-json.json", generate = ["{python}", "scripts/fixture-gen-chroma.py", "crates/d2-rs-text/tests/fixtures/javascript-json-tokens-v227.json"] }]
program = "tools/mathtext-chroma-oracle"
module = "tools/mathtext-chroma-oracle"
args = ["tokens", "{input}"]
env = { D2RS_CHROMA_JSON = "indent" }
stdout = "crates/d2-rs-text/tests/fixtures/javascript-json-tokens-v227.json"
key_deps.files = ["tools/fixtures/inputs/mathtext-txt/chroma-tokens.json"]

[[recipe]]
