outputs = ["crates/d2-rs-language/tests/fixtures/public-compiler-memfs-diagnostics-v090.json"]
argv = ["{python}", "scripts/check-public-compiler.py", "compiler-memfs-diagnostics"]

[[recipe]]
name = "lang-public-compiler-markdown-links"
