# Public TALA API oracle fixtures for crates/d2-rs-lib: serialized graphs
# through d2graph.DeserializeGraph, then d2talalayout.Layout or RouteEdges
# (optionally pre-cancelled), then d2graph.SerializeGraph.
#
# scripts/check-lib-tala-public-api.py builds tools/tala-public-api-oracle
# against the patched upstream checkout and replays one request family from
# scripts/tala_public_api_cases.py (the 2026-10-09 v0.9.0 expanders, kept
# verbatim; families chain off each other's first graph and prefixes, so a
# change to the case module re-keys every family). Logical paths keep their
# historical *-source-v090.json names; the content is captured at the pin.
#
# Regenerate:  uv run --no-project python scripts/regen-fixtures.py --only 'lib-tala-*'
# Test:        cargo test -p d2-rs-lib --features oracle-fixtures

[defaults]
kind = "command"
upstream = true
timeout = 1800

[defaults.key_deps]
files = [
  "scripts/fixture_recipe.py",
  "scripts/check-lib-tala-public-api.py",
  "scripts/tala_public_api_cases.py",
  "tools/tala-public-api-oracle",
  "tools/fixtures/seeds/lib-tala-public-api/legacy-graphs.json",
]
go_toolchain = true
# The package closure of tools/tala-public-api-oracle inside the D2 module
# (`go list -deps`): the TALA adapter and engine, graph serde, the compiler
# front end d2graph links, themes, fonts and text measurement. About a third
# of the tree; unrelated renderers, CLI, other layout engines and tests are out.
upstream_paths = [
  "go.mod",
  "go.sum",
  "d2ast",
  "d2format",
  "d2graph",
  "d2parser",
  "d2target",
  "d2themes",
  "d2layouts/d2sequence",
  "d2layouts/d2talalayout",
  "d2renderers/d2fonts",
  "d2renderers/d2latex",
  "d2renderers/d2scene",
  "d2renderers/internal",
  "lib/color",
  "lib/font",
  "lib/geo",
  "lib/label",
  "lib/shape",
  "lib/svg",
  "lib/syncmap",
  "lib/textmeasure",
]

[[recipe]]
name = "lib-tala-wire-geometry"
description = "Wire box/route bounds, missing positions and source-arrow reversal"
outputs = ["crates/d2-rs-lib/tests/fixtures/wire-geometry-source-v090.json"]
argv = ["{python}", "scripts/check-lib-tala-public-api.py", "wire-geometry"]

