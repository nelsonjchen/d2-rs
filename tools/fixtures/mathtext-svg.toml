# d2renderers/d2svgimport internals (D2's SVG icon/MathJax importer) for
# crates/d2-rs-math/src/svg_*.rs. See docs/FIXTURES.md.
#
# Each recipe overlays tools/fixtures/hooks/mathtext-svg/d2rs_svg_helpers_test.go
# plus its own d2rs_<name>_test.go into the package and runs one TestD2RS...
# test. Most hooks enumerate their sweep inline (adapted from the v0.9.0
# probes); geometry, path and use-graph read requests generated by
# scripts/fixture-gen-svg.py. element, compile-pipeline and frozen-text stop
# compileElement before geometry through the field added by
# tools/patches/mathtext-svgimport-admission.patch (manifest trace_patches).
#
# Regenerate:  uv run --no-project python scripts/regen-fixtures.py --only 'mathtext-svg-*'
# Test:        cargo test -p d2-rs-math --features oracle-fixtures svg_

[defaults]
kind = "go-test-hook"
package = "d2renderers/d2svgimport"
timeout = 1800

[defaults.key_deps]
upstream_paths = ["d2renderers/d2svgimport", "d2renderers/d2scene", "internal/rasterimage", "lib/svg", "go.mod", "go.sum"]

[[recipe]]
name = "mathtext-svg-bounds"
description = "PrimitiveBounds and validatePrimitiveBounds over geometry x matrix x paint x context"
outputs = ["crates/d2-rs-math/tests/fixtures/svg-bounds-v090.json"]
hooks = ["tools/fixtures/hooks/mathtext-svg/d2rs_svg_helpers_test.go", "tools/fixtures/hooks/mathtext-svg/d2rs_bounds_test.go"]
test = "TestD2RSSvgBounds"

[[recipe]]
name = "mathtext-svg-clip-compile"
description = "compileClipPathResource templates x use depth x resource/command limits"
outputs = ["crates/d2-rs-math/tests/fixtures/svg-clip-compile-v090.json"]
hooks = ["tools/fixtures/hooks/mathtext-svg/d2rs_svg_helpers_test.go", "tools/fixtures/hooks/mathtext-svg/d2rs_clip_compile_test.go"]
test = "TestD2RSSvgClipCompile"

[[recipe]]
name = "mathtext-svg-compile-pipeline"
description = "Ordered compile pipeline over small documents x limits"
outputs = ["crates/d2-rs-math/tests/fixtures/svg-compile-pipeline-v090.json"]
hooks = ["tools/fixtures/hooks/mathtext-svg/d2rs_svg_helpers_test.go", "tools/fixtures/hooks/mathtext-svg/d2rs_compile_pipeline_test.go"]
test = "TestD2RSSvgCompilePipeline"

[[recipe]]
name = "mathtext-svg-declarations"
description = "declarationsFor: presentation attributes, inline style and class rules"
outputs = ["crates/d2-rs-math/tests/fixtures/svg-declarations-v090.json"]
hooks = ["tools/fixtures/hooks/mathtext-svg/d2rs_svg_helpers_test.go", "tools/fixtures/hooks/mathtext-svg/d2rs_declarations_test.go"]
test = "TestD2RSSvgDeclarations"

[[recipe]]
