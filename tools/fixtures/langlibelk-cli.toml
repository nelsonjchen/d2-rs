# Upstream test-call observations (scripts/cli_go_api_fixtures.py): pinned Go
# tests with their calls routed through env-gated hooks, supplied as go
# -overlay entries; the original assertions stay active.

[[recipe]]
name = "cli-board-output-unicode"
kind = "go-test-hook"
description = "filepath.Clean and Unicode case-fold/NFC board output collision keys"
outputs = ["crates/d2-rs-cli/tests/fixtures/board-output-unicode.json"]
package = "d2cli"
hooks = ["tools/fixtures/hooks/cli-board-output-unicode/d2rs_board_output_unicode_test.go"]
test = "TestD2RSBoardOutputUnicode"

[[recipe]]
name = "cli-board-manifest"
