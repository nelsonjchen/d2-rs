# Go CLI oracle fixtures for crates/d2-rs-cli (also read by d2-rs-wasm):
# the pinned Go `d2` command, built from the runner's patched upstream tree
# with version stamp v0.9.0 (the version d2-rs reports), run on the
# hand-composed requests of the historical v0.9.0-era witness scripts. See
# scripts/cli_go_fixtures.py for the request sources and docs/FIXTURES.md.
#
# Families that decode PNG/PDF/PPTX run under `uv run --with` pinned Pillow
# and pypdf; the others use the runner's interpreter.
#
# Regenerate:  uv run --no-project python scripts/regen-fixtures.py --only 'cli-*'
# Test:        cargo test -p d2-rs --features oracle-fixtures

[defaults]
kind = "command"
upstream = true
timeout = 1800

[defaults.key_deps]
files = ["scripts/fixture_recipe.py", "scripts/cli_go_fixtures.py"]
go_toolchain = true

[[recipe]]
name = "cli-gif-subtree"
description = "Selected GIF subtrees, quoted and folder-only boards, file/stdin/stdout boundaries"
outputs = ["crates/d2-rs-cli/tests/fixtures/gif-subtree-source-v090.json"]
argv = ["{python}", "scripts/cli_go_fixtures.py", "gif-subtree"]

[[recipe]]
name = "cli-paged-subtree"
description = "Selected PDF/PPTX subtrees: every page, drawing stream, image, annotation and PPTX member"
outputs = ["crates/d2-rs-cli/tests/fixtures/paged-subtree-source-v090.json"]
argv = ["uv", "run", "--no-project", "--with", "pillow==11.3.0", "--with", "pypdf==5.9.0", "python", "scripts/cli_go_fixtures.py", "paged-subtree"]

[[recipe]]
name = "cli-png-metadata"
