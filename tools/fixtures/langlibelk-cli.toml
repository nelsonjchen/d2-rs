outputs = ["crates/d2-rs-cli/tests/fixtures/board-manifest-api.json"]
argv = ["{python}", "scripts/cli_go_api_fixtures.py", "board-manifest"]
key_deps.files = ["scripts/cli_go_api_fixtures.py", "scripts/upstream_overlay.py", "tools/board-manifest-scoreboard/hook_test.go"]

