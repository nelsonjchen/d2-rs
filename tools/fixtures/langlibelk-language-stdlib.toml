# d2-rs-language oracle fixture that depends only on the Go standard library:
# the html.UnescapeString + net/url predicate D2 import links reach. Its key is
# the Go toolchain and the generator, not the D2 pin, so a pin move does not
# recapture it.
#
# Regenerate:  uv run --no-project python scripts/regen-fixtures.py --only lang-import-url
# Test:        cargo test -p d2-rs-language --features oracle-fixtures

[[recipe]]
name = "lang-import-url"
kind = "command"
description = "Go html.UnescapeString + net/url remote-path predicate (stdlib only)"
outputs = ["crates/d2-rs-language/tests/fixtures/import-url.json"]
argv = ["{python}", "scripts/check-import-urls.py"]
key_deps.files = [
  "scripts/fixture_recipe.py",
  "scripts/language_oracle.py",
  "tools/import-url-oracle",
]
key_deps.go_toolchain = true
