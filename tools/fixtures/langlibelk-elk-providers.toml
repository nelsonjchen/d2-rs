argv = ["{python}", "scripts/check-elk-providers.py", "radial"]
key_deps.files = ["scripts/elk_cases/radial.py"]

[[recipe]]
name = "elk-provider-radial-expanded"
description = "Radial optimizer/sorter/wedge, compactor, rotation and margin controls"
outputs = ["crates/d2-rs-elk/src/fixtures/original_radial_expanded.json"]
argv = ["{python}", "scripts/check-elk-providers.py", "radial-expanded"]
key_deps.files = ["scripts/elk_cases/radial.py"]

[[recipe]]
name = "elk-provider-radial-fractional"
description = "Radial seeded fractional trees"
outputs = ["crates/d2-rs-elk/src/fixtures/original_radial_fractional.json"]
argv = ["{python}", "scripts/check-elk-providers.py", "radial-fractional"]
key_deps.files = ["scripts/elk_cases/radial.py"]

[[recipe]]
name = "elk-provider-spore"
