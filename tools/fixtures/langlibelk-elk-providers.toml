key_deps.files = ["scripts/elk_cases/spore.py"]

[[recipe]]
name = "elk-provider-spore-expanded"
description = "SPoRE seeded fractional graphs, delegation, nesting and delegated errors"
outputs = ["crates/d2-rs-elk/src/fixtures/original_spore_expanded.json"]
argv = ["{python}", "scripts/check-elk-providers.py", "spore-expanded"]
key_deps.files = ["scripts/elk_cases/spore.py"]

[[recipe]]
name = "elk-provider-spore-root-transfer"
description = "Root size transfer of a two-node Layered graph: minimum and fixed graph sizes, padding, direction"
outputs = ["crates/d2-rs-elk/src/fixtures/original_spore_root_transfer.json"]
argv = ["{python}", "scripts/check-elk-providers.py", "spore-root-transfer"]
key_deps.files = ["scripts/elk_cases/spore.py"]

[[recipe]]
name = "elk-provider-force-stress"
description = "Force and Stress shapes, options and seeded varied graphs"
outputs = ["crates/d2-rs-elk/src/fixtures/original_force_stress.json"]
