# Go-oracle fixtures for crates/d2-rs-render (renderexport area): Markdown
# layout/paint/scene grids and renderer geometry probes, read by
# crates/d2-rs-render (and crates/d2-rs-export) tests under `oracle-fixtures`.
# See docs/FIXTURES.md; retired/merged inputs are recorded in
# docs/fixture-retirements/renderexport.md.
#
# Hooks and programs were harvested from the v0.9.0-era probes
# (../d2-v0.9.0-trace *_probe_test.go, .reference/*/tools/probes,
# .reference/*/source-module) and retargeted to the manifest pin. The
# historical `-source-v090` logical names are kept so readers did not move.
#
# Host architecture matters: the historical captures came from darwin/arm64,
# where Go fuses multiply-adds. Regenerated on amd64, circle-arrow,
# legend-connections, sketch-zigzag, badge-anchor (diamond 10x10 anchors) and
# table-paint (unread legacy_cells widths) differ in the last ulp, and the
# Rust contract that reproduces arm64 FMA rounding
# (d2-rs-export legend_animation_source_contract) then fails. Regenerate these
# on arm64 for exact parity; circle-arrow's reader is already aarch64-only.
#
# Regenerate:  uv run --no-project python scripts/regen-fixtures.py --only 'render-*'
# Test:        cargo test -p d2-rs-render --features oracle-fixtures

[defaults]
timeout = 1800

[defaults.key_deps]
upstream_paths = ["go.mod", "go.sum"]

# lib/textmeasure package-internal Markdown layout, legacy cell measurement
# and inline paint over the seed grids in tools/fixtures/seeds/render-markdown.
[[recipe]]
name = "render-markdown-textmeasure"
kind = "go-test-hook"
description = "Markdown LayoutMarkdown/RenderMarkdown/legacy cells/inline paint over seed snippet grids"
package = "lib/textmeasure"
hooks = ["tools/fixtures/hooks/render-markdown-textmeasure/d2rs_markdown_textmeasure_test.go"]
test = "TestD2RSMarkdownTextmeasure"
inputs = [{ path = "markdown-jobs.json", generate = ["{python}", "scripts/render_oracle_fixtures.py", "requests"] }]
outputs = [
  "crates/d2-rs-render/tests/fixtures/markdown-natural-source-v090.json",
  "crates/d2-rs-render/tests/fixtures/markdown-recursive-paint-source-v090.json",
  "crates/d2-rs-render/tests/fixtures/markdown-table-paint-source-v090.json",
  "crates/d2-rs-render/tests/fixtures/markdown-mixed-flow-source-v090.json",
  "crates/d2-rs-render/tests/fixtures/markdown-table-inline-source-v090.json",
  "crates/d2-rs-render/tests/fixtures/paragraph-wrap-source-v090.json",
  "crates/d2-rs-render/tests/fixtures/markdown-heading-flow-source-v090.json",
]
key_deps.files = ["scripts/fixture_recipe.py", "tools/fixtures/seeds/render-markdown"]
key_deps.upstream_paths = [
  "lib/textmeasure", "d2renderers/d2fonts", "d2renderers/d2scene", "d2renderers/internal/fontface",
  "d2renderers/internal/fontfallback", "lib/compression", "lib/font", "lib/geo", "lib/svg", "lib/syncmap",
]

# One Markdown text shape per request built by d2scenebuild.Build; the
# generator projects the rows into the two fixtures.
[[recipe]]
name = "render-markdown-scene"
kind = "command"
upstream = true
description = "Markdown text-shape scenes: link metadata, appendix titles, viewport/clip rows"
argv = ["{python}", "scripts/render_oracle_fixtures.py", "scene"]
outputs = [
  "crates/d2-rs-render/tests/fixtures/markdown-scene-metadata-source-v090.json",
  "crates/d2-rs-render/tests/fixtures/markdown-layout-viewport-source-v090.json",
]
key_deps.go_toolchain = true
key_deps.files = [
  "scripts/fixture_recipe.py", "tools/fixtures/seeds/render-markdown/scene.json",
  "tools/fixtures/hooks/render-markdown-scene",
]
key_deps.upstream_paths = [
  "d2renderers/d2scenebuild", "d2renderers/d2scene", "d2renderers/d2fonts", "d2renderers/d2latex",
  "d2renderers/d2sketch", "d2renderers/d2svgimport", "d2renderers/internal", "d2target", "d2themes",
  "d2ast", "d2format", "d2graph", "d2parser", "internal/rasterimage", "lib/color", "lib/compression",
  "lib/font", "lib/geo", "lib/imageasset", "lib/label", "lib/localfile", "lib/netpolicy", "lib/shape",
  "lib/svg", "lib/syncmap", "lib/textmeasure",
]

