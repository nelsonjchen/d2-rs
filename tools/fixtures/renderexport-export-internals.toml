# Go-oracle fixtures for crates/d2-rs-export, second pass: d2svgimport/imageasset
# outcome tables, d2cli PNG digests and scenebuild internals. Hooks under
# tools/fixtures/hooks/renderexport-*/ were harvested from the v0.9.0-era
# probes (../d2-v0.9.0-trace/**/*_probe_test.go, ../d2-v0.9.0-trace/*.overlay,
# tools/probes/*.go) and run against the manifest pin. Hand-authored inputs
# that are not a grid (SVG documents, Markdown requests) are small seeds under
# tools/fixtures/inputs/renderexport/. See docs/FIXTURES.md. Recipes retired
# with the legacy SVG renderer are listed in docs/fixture-retirements/renderexport.md.
#
# Regenerate:  uv run --no-project python scripts/regen-fixtures.py --only 'renderexport-*' --jobs 4
# Test:        cargo test -p d2-rs-export --features oracle-fixtures

[defaults]
kind = "go-test-hook"
timeout = 1800
key_deps.upstream_paths = ["d2renderers", "d2target", "d2themes", "lib", "internal", "go.mod", "go.sum"]

# SVG admission/import outcome tables over hand-authored SVG documents.
[[recipe]]
name = "renderexport-svg-asset-envelope"
description = "lib/imageasset probeResource outcomes for XML declaration/DOCTYPE/PI envelopes"
outputs = ["crates/d2-rs-export/tests/fixtures/svg-asset-envelope-outcomes-source-v090.json"]
inputs = ["tools/fixtures/inputs/renderexport/svg-outcomes-envelope.json"]
package = "lib/imageasset"
hooks = ["tools/fixtures/hooks/renderexport-svg-outcomes/d2rs_svg_asset_outcomes_test.go"]
test = "TestD2RSSVGAssetOutcomes"
key_deps.upstream_paths = ["lib", "internal", "go.mod", "go.sum"]

[[recipe]]
name = "renderexport-svg-asset-xml"
description = "lib/imageasset raw XML validation and probeResource outcomes for malformed documents"
outputs = ["crates/d2-rs-export/tests/fixtures/svg-asset-xml-outcomes-source-v090.json"]
inputs = ["tools/fixtures/inputs/renderexport/svg-outcomes-xml.json"]
package = "lib/imageasset"
hooks = ["tools/fixtures/hooks/renderexport-svg-outcomes/d2rs_svg_asset_outcomes_test.go"]
test = "TestD2RSSVGAssetOutcomes"
env = { D2RS_SVG_RAW = "1" }
key_deps.upstream_paths = ["lib", "internal", "go.mod", "go.sum"]

[[recipe]]
name = "renderexport-svg-import-envelope"
description = "d2svgimport.ImportNode outcomes for XML declaration/DOCTYPE/PI envelopes"
outputs = ["crates/d2-rs-export/tests/fixtures/svg-import-envelope-outcomes-source-v090.json"]
inputs = ["tools/fixtures/inputs/renderexport/svg-outcomes-envelope.json"]
package = "d2renderers/d2svgimport"
hooks = ["tools/fixtures/hooks/renderexport-svg-outcomes/d2rs_svg_import_outcomes_test.go"]
test = "TestD2RSSVGImportOutcomes"

[[recipe]]
name = "renderexport-svg-import-attribute"
description = "d2svgimport.ImportNode outcomes for unsupported/namespaced root and element attributes"
outputs = ["crates/d2-rs-export/tests/fixtures/svg-import-attribute-outcomes-source-v090.json"]
inputs = ["tools/fixtures/inputs/renderexport/svg-outcomes-attribute.json"]
package = "d2renderers/d2svgimport"
hooks = ["tools/fixtures/hooks/renderexport-svg-outcomes/d2rs_svg_import_outcomes_test.go"]
test = "TestD2RSSVGImportOutcomes"

[[recipe]]
name = "renderexport-svg-import-namespace"
description = "d2svgimport.ImportNode outcomes for xml/xmlns prefix bindings"
outputs = ["crates/d2-rs-export/tests/fixtures/svg-import-namespace-outcomes-source-v090.json"]
inputs = ["tools/fixtures/inputs/renderexport/svg-outcomes-namespace.json"]
package = "d2renderers/d2svgimport"
hooks = ["tools/fixtures/hooks/renderexport-svg-outcomes/d2rs_svg_import_outcomes_test.go"]
test = "TestD2RSSVGImportOutcomes"

[[recipe]]
name = "renderexport-svg-import-topology"
description = "d2svgimport.ImportNode outcomes for metadata/title/namedview topology"
outputs = ["crates/d2-rs-export/tests/fixtures/svg-import-topology-outcomes-source-v090.json"]
inputs = ["tools/fixtures/inputs/renderexport/svg-outcomes-topology.json"]
package = "d2renderers/d2svgimport"
hooks = ["tools/fixtures/hooks/renderexport-svg-outcomes/d2rs_svg_import_outcomes_test.go"]
test = "TestD2RSSVGImportOutcomes"

[[recipe]]
name = "renderexport-svg-import-viewport"
description = "d2svgimport.ImportNode outcomes for root width/height/viewBox values"
outputs = ["crates/d2-rs-export/tests/fixtures/svg-import-viewport-outcomes-source-v090.json"]
inputs = ["tools/fixtures/inputs/renderexport/svg-outcomes-viewport.json"]
package = "d2renderers/d2svgimport"
hooks = ["tools/fixtures/hooks/renderexport-svg-outcomes/d2rs_svg_import_outcomes_test.go"]
test = "TestD2RSSVGImportOutcomes"

[[recipe]]
name = "renderexport-positioned-tooltip-png"
description = "d2cli PNG rendering of the positioned-tooltip target shapes: decoded RGB digests of the 48 unicode rows"
after = ["render-positioned-tooltip"]
outputs = [
  "crates/d2-rs-export/tests/fixtures/positioned-tooltip-unicode-png-source-v090.json",
]
package = "d2cli"
hooks = ["tools/fixtures/hooks/renderexport-positioned-tooltip-png/d2rs_positioned_tooltip_png_test.go"]
test = "TestD2RSPositionedTooltipPNG"
key_deps.upstream_paths = ["."]

[[recipe]]
name = "renderexport-markdown-document-links"
description = "Markdown text shapes built at scale with appendix/link budgets: layout, links, viewport"
outputs = ["crates/d2-rs-export/tests/fixtures/markdown-document-links-source-v090.json"]
inputs = ["tools/fixtures/inputs/renderexport/markdown-document-links-requests.json"]
package = "d2renderers/d2scenebuild"
hooks = ["tools/fixtures/hooks/renderexport-scenebuild-probes/d2rs_scenebuild_probes_test.go"]
test = "TestD2RSMarkdownDocumentLinks"
