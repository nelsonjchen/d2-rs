# Go-oracle fixtures for crates/d2-rs-export, second pass: font shaping/cmap,
# d2raster frames, d2svgimport/imageasset outcome tables and scenebuild
# internals. Hooks under tools/fixtures/hooks/renderexport-*/ were harvested
# from the v0.9.0-era probes (../d2-v0.9.0-trace/**/*_probe_test.go,
# ../d2-v0.9.0-trace/*.overlay, tools/probes/*.go) and run against the
# manifest pin. Request grids live in the hooks; hand-authored inputs that are
# not a grid (cmap subtables, SVG documents) are small seeds under
# tools/fixtures/inputs/renderexport/. See docs/FIXTURES.md.
#
# Regenerate:  uv run --no-project python scripts/regen-fixtures.py --only 'renderexport-*' --jobs 4
# Test:        cargo test -p d2-rs-export --features oracle-fixtures

[defaults]
kind = "go-test-hook"
timeout = 1800
key_deps.upstream_paths = ["d2renderers", "d2target", "d2themes", "lib", "internal", "go.mod", "go.sum"]

[[recipe]]
name = "renderexport-control-shaping"
description = "Bundled Source Sans Pro shaping of ASCII control characters (3 faces x 3 sizes x 10 texts)"
outputs = ["crates/d2-rs-export/tests/fixtures/control-shaping-source-v090.json"]
package = "d2renderers/d2fonts"
hooks = ["tools/fixtures/hooks/renderexport-font-shaping/d2rs_font_shaping_test.go"]
test = "TestD2RSFontShaping"
env = { D2RS_SHAPING_MODE = "control" }

