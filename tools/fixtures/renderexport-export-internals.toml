name = "renderexport-upstream-gifs"
kind = "command"
upstream = true
description = "Valid animated GIFs copied from the pinned upstream tree (lib/xgif test output, an e2e CLI raster golden)"
argv = ["{python}", "-c", "import shutil,sys; shutil.copyfile(sys.argv[1], sys.argv[2]); shutil.copyfile(sys.argv[3], sys.argv[4])",
        "{upstream}/lib/xgif/test_output.gif", "{stage}/crates/d2-rs-export/tests/fixtures/source-xgif-v090.gif",
        "{upstream}/e2etests-cli/testdata/raster/animation-1050.exp.gif", "{stage}/crates/d2-rs-export/tests/fixtures/source-animation-v090.gif"]
outputs = ["crates/d2-rs-export/tests/fixtures/source-xgif-v090.gif", "crates/d2-rs-export/tests/fixtures/source-animation-v090.gif"]
key_deps.upstream_paths = ["lib/xgif/test_output.gif", "e2etests-cli/testdata/raster/animation-1050.exp.gif"]

[[recipe]]
name = "renderexport-svg-clip-tolerance"
description = "d2raster flattenTolerance for 30 imported-math path matrices"
outputs = ["crates/d2-rs-export/tests/fixtures/svg-clip-tolerance-source-v090.json"]
inputs = ["tools/fixtures/inputs/renderexport/svg-clip-tolerance-matrices.json"]
package = "d2renderers/d2raster"
hooks = ["tools/fixtures/hooks/renderexport-raster-probes/d2rs_raster_probes_test.go"]
test = "TestD2RSClipTolerance"

[[recipe]]
name = "renderexport-empty-svg-ink"
description = "Hand-authored math SVGs with empty/unpainted/hidden ink as clipped vector images"
outputs = ["crates/d2-rs-export/tests/fixtures/empty-svg-ink-source-v090.json"]
inputs = ["tools/fixtures/inputs/renderexport/empty-svg-ink-requests.json"]
package = "d2renderers/d2raster"
hooks = ["tools/fixtures/hooks/renderexport-raster-probes/d2rs_raster_probes_test.go"]
test = "TestD2RSMathVectorFrames"

[[recipe]]
name = "renderexport-markdown-document-links"
description = "Markdown text shapes built at scale with appendix/link budgets: layout, links, viewport"
outputs = ["crates/d2-rs-export/tests/fixtures/markdown-document-links-source-v090.json"]
inputs = ["tools/fixtures/inputs/renderexport/markdown-document-links-requests.json"]
package = "d2renderers/d2scenebuild"
hooks = ["tools/fixtures/hooks/renderexport-scenebuild-probes/d2rs_scenebuild_probes_test.go"]
test = "TestD2RSMarkdownDocumentLinks"
