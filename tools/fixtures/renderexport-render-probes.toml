# Renderer probe fixtures for crates/d2-rs-render (renderexport area, second
# pass): d2scenebuild/d2svg/d2target/lib/textmeasure internals over fixed
# grids, read by crates/d2-rs-render tests under `oracle-fixtures`. See
# docs/FIXTURES.md; retirements are in docs/fixture-retirements/renderexport.md.
#
# Hooks under tools/fixtures/hooks/render-*/ were harvested from the
# v0.9.0-era probes (../d2-v0.9.0-trace/**/*_probe_test.go and its root
# codex_*_test.go.overlay / *_probe.go.overlay files) and retargeted to the
# manifest pin; their request grids are inlined or expanded by
# scripts/render_probe_fixtures.py from seeds under tools/fixtures/seeds/render-*.
# Float-bit outputs follow the host architecture (docs/FIXTURES.md, arm64 is
# the reference).
#
# Regenerate:  uv run --no-project python scripts/regen-fixtures.py --only 'render-probe-*'
# Test:        cargo test -p d2-rs-render --features oracle-fixtures

[defaults]
kind = "go-test-hook"
timeout = 1800

[defaults.key_deps]
upstream_paths = [
  "d2renderers", "d2target", "d2themes", "d2layouts", "d2ast", "d2format", "d2graph", "d2parser",
  "d2compiler", "d2ir", "d2lib", "d2exporter", "internal", "lib", "e2etests/testdata/regression",
  "go.mod", "go.sum",
]

[[recipe]]
name = "render-probe-markdown-font-layouts"
description = "LayoutMarkdown/MeasureMarkdown geometry and CSS font boxes: inline-code and heading sources x family x size"
package = "lib/textmeasure"
hooks = ["tools/fixtures/hooks/render-markdown-font-layouts/d2rs_markdown_font_layouts_test.go"]
test = "TestD2RSMarkdownFontLayouts"
outputs = [
  "crates/d2-rs-render/tests/fixtures/markdown-font-layout-source-v090.json",
  "crates/d2-rs-render/tests/fixtures/markdown-heading-layout-source-v090.json",
]

