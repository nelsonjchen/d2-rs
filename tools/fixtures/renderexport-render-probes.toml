# Renderer probe fixtures for crates/d2-rs-render (renderexport area, second
# pass): d2scenebuild/d2svg/d2target/lib/textmeasure internals over fixed
# grids, read by crates/d2-rs-render tests under `oracle-fixtures`. See
# docs/FIXTURES.md; retirements are in docs/fixture-retirements/renderexport.md.
#
# Hooks under tools/fixtures/hooks/render-*/ were harvested from the
# v0.9.0-era probes (../d2-v0.9.0-trace/**/*_probe_test.go and its root
# codex_*_test.go.overlay / *_probe.go.overlay files) and retargeted to the
# manifest pin; their request grids are inlined or expanded by
# scripts/render_probe_fixtures.py from seeds under tools/fixtures/seeds/render-*.
# Float-bit outputs follow the host architecture (docs/FIXTURES.md, arm64 is
# the reference).
#
# Regenerate:  uv run --no-project python scripts/regen-fixtures.py --only 'render-probe-*'
# Test:        cargo test -p d2-rs-render --features oracle-fixtures

[defaults]
kind = "go-test-hook"
timeout = 1800

[defaults.key_deps]
upstream_paths = [
  "d2renderers", "d2target", "d2themes", "d2layouts", "d2ast", "d2format", "d2graph", "d2parser",
  "d2compiler", "d2ir", "d2lib", "d2exporter", "internal", "lib", "e2etests/testdata/regression",
  "go.mod", "go.sum",
]

[[recipe]]
name = "render-probe-markdown-font-layouts"
description = "LayoutMarkdown/MeasureMarkdown geometry and CSS font boxes: inline-code and heading sources x family x size"
package = "lib/textmeasure"
hooks = ["tools/fixtures/hooks/render-markdown-font-layouts/d2rs_markdown_font_layouts_test.go"]
test = "TestD2RSMarkdownFontLayouts"
outputs = [
  "crates/d2-rs-render/tests/fixtures/markdown-font-layout-source-v090.json",
  "crates/d2-rs-render/tests/fixtures/markdown-heading-layout-source-v090.json",
]

[[recipe]]
name = "render-probe-outside-icon-bounds"
description = "d2target BoundingBox with an outside icon per shape kind x icon position"
package = "d2target"
hooks = ["tools/fixtures/hooks/render-outside-icon-bounds/d2rs_outside_icon_bounds_test.go"]
test = "TestD2RSOutsideIconBounds"
outputs = ["crates/d2-rs-render/tests/fixtures/outside-icon-bounds-source-v090.json"]
key_deps.upstream_paths = ["d2target", "lib", "d2renderers/d2fonts", "d2renderers/internal", "go.mod", "go.sum"]

[[recipe]]
name = "render-probe-sequence-note-references"
kind = "command"
upstream = true
description = "Compiler object references, note/group predicates for sequence note sources"
argv = ["{python}", "scripts/render_probe_fixtures.py", "sequence-note-references"]
outputs = [
  "crates/d2-rs-render/tests/fixtures/sequence-note-references-source-v090.json",
]
key_deps.go_toolchain = true
key_deps.files = ["scripts/fixture_recipe.py", "scripts/render_oracle_fixtures.py", "scripts/render_probe_fixtures.py",
                  "tools/fixtures/seeds/render-probes.json", "tools/fixtures/hooks/render-compile-probe"]

[[recipe]]
name = "render-probe-sequence-groups"
kind = "command"
upstream = true
description = "Sequence group predicates and fills (TALA)"
argv = ["{python}", "scripts/render_probe_fixtures.py", "sequence-groups"]
outputs = [
  "crates/d2-rs-render/tests/fixtures/sequence-group-reference-source-v090.json",
]
key_deps.go_toolchain = true
key_deps.files = ["scripts/fixture_recipe.py", "scripts/render_oracle_fixtures.py", "scripts/render_probe_fixtures.py",
                  "tools/fixtures/seeds/render-probes.json", "tools/fixtures/hooks/render-compile-probe"]

[[recipe]]
name = "render-probe-markdown-flow"
description = "Public LayoutMarkdown/RenderMarkdown of list-width snippets x family x size"
package = "lib/textmeasure"
hooks = ["tools/fixtures/hooks/render-markdown-flow/d2rs_markdown_flow_test.go"]
test = "TestD2RSMarkdownFlow"
inputs = ["tools/fixtures/seeds/render-markdown-flow.json"]
outputs = [
  "crates/d2-rs-render/tests/fixtures/markdown-list-width-source-v090.json",
]

[[recipe]]
name = "render-probe-target-empty-config-bytes"
kind = "command"
upstream = true
description = "d2target.Diagram.Bytes hash input of empty targets with and without d2-config"
argv = ["{python}", "scripts/render_probe_fixtures.py", "target-empty-config-bytes"]
outputs = ["crates/d2-rs-render/tests/fixtures/target-empty-config-bytes-source-v090.json"]
key_deps.go_toolchain = true
key_deps.files = ["scripts/fixture_recipe.py", "scripts/render_oracle_fixtures.py", "scripts/render_probe_fixtures.py",
                  "tools/fixtures/seeds/render-probes.json", "tools/fixtures/hooks/render-compile-probe"]

# Go standard library only: keyed on the toolchain, not the D2 pin.
[[recipe]]
name = "render-probe-mime-registration"
kind = "go-program"
upstream = false
description = "Go mime.AddExtensionType acceptance and TypeByExtension answers for registration witnesses"
outputs = ["crates/d2-rs-render/tests/fixtures/mime-registration-source-go127.json"]
inputs = ["tools/fixtures/seeds/render-mime-registration.json"]
program = "tools/fixtures/programs/render-mime-registration"
module = "tools/fixtures/programs/render-stdlib"
stdin = "{input}"
stdout = "crates/d2-rs-render/tests/fixtures/mime-registration-source-go127.json"
key_deps.upstream_paths = []

[[recipe]]
name = "render-probe-markdown-link-transactions"
description = "addMarkdownLinkRegion transactions and link/appendix budget admission grid"
package = "d2renderers/d2scenebuild"
hooks = ["tools/fixtures/hooks/render-markdown-link-transactions/d2rs_markdown_link_transactions_test.go"]
test = "TestD2RSMarkdownLinkTransactions"
outputs = ["crates/d2-rs-render/tests/fixtures/markdown-link-transactions-source-v090.json"]
