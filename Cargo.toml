[workspace]
members = ["crates/d2-rs-text", "crates/d2-rs-core", "crates/d2-rs-language", "crates/d2-rs-tala", "crates/d2-rs-dagre", "crates/d2-rs-elk", "crates/d2-rs-layout", "crates/d2-rs-lib", "crates/d2-rs-wasm", "crates/d2-rs-cli", "crates/d2-rs-render", "crates/d2-rs-editor", "crates/d2-rs-math", "crates/d2-rs-sketch", "crates/d2-rs-export", "crates/d2-rs-goflate", "crates/d2-rs-isometric", "crates/d2-rs-scene", "crates/d2-rs-fontface", "crates/d2-rs-scenebuild", "crates/d2-rs-raster", "crates/d2-rs-target", "crates/d2-rs-testdata"]
resolver = "2"

[workspace.package]
version = "0.1.7"
edition = "2024"
rust-version = "1.98.1"
license = "MPL-2.0"
authors = ["Nelson Chen"]
repository = "https://github.com/nelsonjchen/d2-rs"
homepage = "https://github.com/nelsonjchen/d2-rs"
keywords = ["d2", "diagram", "diagrams-as-code", "svg", "graph-layout"]
categories = ["visualization", "graphics"]

# The ports keep Go's signatures, literal constants and control flow so they
# can be compared line by line with the pinned source. Clippy's suggestions
# for these would break that correspondence or, for approx_constant, change
# float bits that the output depends on. Nested ifs mirror Go, which has no
# let chains.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
approx_constant = "allow"
excessive_precision = "allow"
needless_range_loop = "allow"
collapsible_if = "allow"
collapsible_else_if = "allow"
# Go's comparison and clamping semantics under NaN differ from partial_cmp
# and f64::clamp; the ported code keeps Go's.
neg_cmp_op_on_partial_ord = "allow"
manual_clamp = "allow"
# Go control flow and initialization kept as written in the pinned source.
explicit_counter_loop = "allow"
field_reassign_with_default = "allow"
unnecessary_unwrap = "allow"
if_same_then_else = "allow"
only_used_in_recursion = "allow"
question_mark = "allow"
drop_non_drop = "allow"
wrong_self_convention = "allow"
result_large_err = "allow"
redundant_allocation = "allow"
manual_unwrap_or_default = "allow"
unnecessary_filter_map = "allow"
# Go String() methods, Go literal spellings and Go-shaped enums.
inherent_to_string = "allow"
inconsistent_digit_grouping = "allow"
large_enum_variant = "allow"
should_implement_trait = "allow"
# New in Rust 1.98 and purely stylistic; its fix does not compile on our call sites.
chunks_exact_to_as_chunks = "allow"
# Comparators written as Go sort.Slice less functions.
unnecessary_sort_by = "allow"
# ..Default::default() mirrors Go struct literals, which zero-fill the rest.
needless_update = "allow"

[workspace.dependencies]
regex = "1.12"
num-bigint = "0.4.8"
num-rational = "0.4.2"
base64 = "0.22"
roxmltree = { version = "0.21.1", features = ["positions"] }
svgtypes = "0.16.1"
libm = "0.2.16"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
mimalloc = { version = "0.1", default-features = false }
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip", "raw_value"] }
thiserror = "2.0"
wasm-bindgen = "=0.2.128"
gif = "0.13.1"
png = "0.18.1"
ttf-parser = "0.25.1"
sha2 = "0.10"
rustybuzz = { package = "d2-rs-rustybuzz", version = "0.20.1", path = "vendor/rustybuzz-go-text" }
unicode-segmentation = "1.12.0"
unicode-width = "0.1.14"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
brotli-decompressor = "5.0.3"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }
zune-jpeg = "0.5.9"
image-webp = "0.2.4"
imagesize = "0.15.0"
ring = "0.17.14"
ctrlc = "3.5.2"

[profile.release]
# Fat LTO shrinks the stripped Linux arm64 CLI from 49.2 MB to 43.7 MB (Go's
# d2 is 40.8 MB). Never set panic = "abort" (40.3 MB): about 110
# catch_unwind sites in TALA, ELK, the compiler and the CLI mirror Go's
# recover() blocks, which turn internal panics into Go's errors or
# fallbacks; --watch also relies on unwinding to survive a failed connection.
lto = "fat"
codegen-units = 1
strip = "symbols"

# Keep the everyday edit/build loop cheap while retaining source locations in
# panics and backtraces.
[profile.dev]
debug = "line-tables-only"

# The recovered optimizer deliberately evaluates many candidate placements.
# Use this profile for oracle/corpus validation, where runtime dominates rebuild
# latency. Ordinary development builds intentionally remain unoptimized.
[profile.oracle]
inherits = "dev"
# Incremental state (and the thin-LTO objects it retains) grew target/ past
# its 10 GiB ceiling in one test cycle; LTO with one codegen unit gains
# nothing from it.
incremental = false
opt-level = 3
lto = "thin"
codegen-units = 1
debug-assertions = false
overflow-checks = false

[workspace.dependencies.d2-rs-testdata]
path = "crates/d2-rs-testdata"

[workspace.dependencies.d2-rs-core]
path = "crates/d2-rs-core"
version = "0.1.7"

[workspace.dependencies.d2-rs-language]
path = "crates/d2-rs-language"
version = "0.1.7"

[workspace.dependencies.d2-rs-text]
path = "crates/d2-rs-text"
version = "0.1.7"

[workspace.dependencies.d2-rs-tala]
path = "crates/d2-rs-tala"
version = "0.1.7"
default-features = false

[workspace.dependencies.d2-rs-layout]
path = "crates/d2-rs-layout"
version = "0.1.7"

[workspace.dependencies.d2-rs-dagre]
path = "crates/d2-rs-dagre"
version = "0.1.7"

[workspace.dependencies.d2-rs-elk]
path = "crates/d2-rs-elk"
version = "0.1.7"

[profile.diagnostic]
inherits = "release"
debug = 0
strip = "none"
# Keep ordinary parity builds bounded. Enable symbols only for a scoped debugger run
# with CARGO_PROFILE_DIAGNOSTIC_DEBUG=2, then retire its obsolete variants.
lto = false
codegen-units = 16

[workspace.dependencies.d2-rs-lib]
path = "crates/d2-rs-lib"
